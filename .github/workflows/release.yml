name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest

  quality:
    name: Lint and documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,docs]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  build:
    name: Build release distributions
    needs: [tests, quality]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      tag: ${{ steps.release_metadata.outputs.tag }}
      release_required: ${{ steps.release_metadata.outputs.release_required }}

    steps:
      - name: Check out the release commit and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release metadata and branch
        id: release_metadata
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          release_tag="v$package_version"

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Releases must be started from the master branch." >&2
            exit 1
          fi

          if ! grep -Fq "## [$package_version]" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a section named ## [$package_version]." >&2
            exit 1
          fi

          existing_tag_commit="$(git rev-list -n 1 "$release_tag" 2>/dev/null || true)"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          if [[ -n "$existing_tag_commit" ]]; then
            echo "Tag $release_tag already exists; this push will be validated but not published."
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $release_tag does not exist; this version will be released."
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        if: steps.release_metadata.outputs.release_required == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        if: steps.release_metadata.outputs.release_required == 'true'
        run: python -m build

      - name: Check distribution metadata
        if: steps.release_metadata.outputs.release_required == 'true'
        run: python -m twine check dist/*

      - name: Store release distributions
        if: steps.release_metadata.outputs.release_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub release
    needs: build
    if: needs.build.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysteer-adaptation
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the PyPI publishing client
        run: python -m pip install "twine==7.0.0" "id==1.6.1"

      - name: Publish distributions to PyPI
        run: python -m twine upload --non-interactive dist/*
