[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysteer-adaptation"
version = "0.1.1"
description = "Python activation-steering library for PyTorch and Hugging Face-style language models."
readme = { file = "readme.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Mattia Piazzalunga", email = "mattiapiazzalunga@outlook.com" }
]
maintainers = [
  { name = "Mattia Piazzalunga", email = "mattiapiazzalunga@outlook.com" }
]
keywords = [
  "activation-engineering",
  "activation-steering",
  "ai-safety",
  "huggingface",
  "interpretability",
  "large-language-models",
  "language-models",
  "llm",
  "mechanistic-interpretability",
  "model-steering",
  "pytorch",
  "representation-engineering",
  "transformers"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "torch>=2.1,<3",
  "pandas>=2.0,<3",
  "accelerate>=0.26,<2",
  "tqdm>=4.66,<5",
  "transformers>=4.40,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
]
docs = [
  "sphinx>=8.2",
  "myst-parser>=4.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/mattiapiazzalunga/pysteer"
Documentation = "https://mattiapiazzalunga.github.io/pysteer/"
Issues = "https://github.com/mattiapiazzalunga/pysteer/issues"
Source = "https://github.com/mattiapiazzalunga/pysteer"
Changelog = "https://github.com/mattiapiazzalunga/pysteer/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = true
py-modules = ["executor"]

[tool.setuptools.packages.find]
include = [
  "pysteer*",
  "activation_manager*",
  "enums*",
  "prompt_generator*",
  "steering_engine*",
  "steering_strategy*",
  "utils*",
  "vector_update_strategy*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = [
  "activation_manager",
  "enums",
  "executor",
  "prompt_generator",
  "steering_engine",
  "steering_strategy",
  "utils",
  "vector_update_strategy",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".git",
  ".idea",
  "__pycache__",
  "docs/_build",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
